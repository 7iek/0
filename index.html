<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5=1.0">
    <title>Little Death</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }
        .card {
            background-color: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 19px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .socials a {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 18px;
            height: 18px;
            font-size: 15px;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .socials a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .music-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 15px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .music-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .views {
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .views i {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- خلفية الفيديو صامتة -->
    <video autoplay muted loop class="bg-video">
        <source src="https://cdn.discordapp.com/attachments/1527314746637029430/1549898844433686580/lst.mp4?ex=6aac5f48&is=6aab0dc8&hm=e8ff4bc65b0c5ee85a1b9bbedba4c15459900b57718de984d41eecfbe6e96861&" type="video/mp4">
    </video>

    <!-- عنصر الصوت المستقل -->
    <audio id="bg-audio" loop>
        <source src="حط_رابط_المقطع_الصوتي_هنا_اذا_عندك_رابط_ثاني" type="audio/mp3">
    </audio>

    <div class="card">
        <img src="https://cdn.discordapp.com/attachments/1527314746637029430/1549894413486915735/download_46.jpg?ex=6aac5b27&is=6aab09a7&hm=459b932b039851c63e7178638f71ce932a956f2e9ddbbba92231b630c46e2ef8&" alt="Avatar" class="avatar">
        
        <h1>LittleDeath</h1>

        <div class="socials">
            <a href="https://www.tiktok.com/@lvr_" target="_blank" title="تيك توك"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" title="ديسكورد: .__.__.__._._"><i class="fab fa-discord"></i></a>
            <a href="https://www.snapchat.com/add/x.u2c" target="_blank" title="سناب شات"><i class="fab fa-snapchat"></i></a>
        </div>

        <button class="music-toggle" onclick="toggleAudio()">
            <i class="fa-solid fa-volume-xmark" id="vol-icon"></i> <span id="vol-text">تشغيل الصوت</span>
        </button>

        <div class="views">
            <i class="fa-solid fa-eye"></i> 213
        </div>
    </div>

    <script>
        function toggleAudio() {
            var audio = document.getElementById("bg-audio");
            var icon = document.getElementById("vol-icon");
            var text = document.getElementById("vol-text");

            if (audio.paused) {
                audio.play();
                icon.className = "fa-solid fa-volume-high";
                text.innerText = "إيقاف الصوت";
            } else {
                audio.pause();
                icon.className = "fa-solid fa-volume-xmark";
                text.innerText = "تشغيل الصوت";
            }
        }
    </script>

</body>
</html>
